<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Intelligence Hub | Interactive reference</title><style>body{background:#0b1524;color:#e4edf7;font:16px system-ui;max-width:960px;margin:auto;padding:24px}a{color:#70e0d1}section{background:#17283b;padding:20px;border-radius:12px;margin:16px 0}button,select,input{font:inherit;padding:8px;margin:5px}svg{width:100%;height:auto}pre{white-space:pre-wrap}table{width:100%;text-align:left}td,th{padding:8px}</style><a href="index.html">← Portfolio</a><h1>Data Intelligence Hub | Interactive reference</h1><p>Fictional catalog; browser-side search and metadata exploration, not the original Flask backend.</p><section><label>Workflow <select id="wf"><option>WF1 — Initiative</option><option>WF2 — Operational task</option></select></label><input id="q" value="retail sales" aria-label="Search query"><button id="go">Search assets</button><div id="out"></div></section><section><h2>WF3 — Metadata explorer</h2><select id="node" aria-label="Metadata node"></select><pre id="detail"></pre><button id="doc">Generate documentation</button><pre id="report"></pre></section><script>const catalog=[{name:'Retail performance',tags:'sales revenue store retail dashboard',views:140},{name:'Product profitability',tags:'margin cost product profit sales',views:95},{name:'Inventory health',tags:'stock replenishment inventory store',views:75}];const graph={"nodes": [{"id": "sales", "type": "table", "label": "Sales"}, {"id": "revenue", "type": "field", "label": "Revenue"}, {"id": "cost", "type": "field", "label": "Cost"}, {"id": "profit", "type": "calculation", "label": "Revenue minus cost"}, {"id": "report", "type": "dashboard", "label": "Retail performance"}], "edges": [{"source": "sales", "target": "revenue"}, {"source": "sales", "target": "cost"}, {"source": "revenue", "target": "profit"}, {"source": "cost", "target": "profit"}, {"source": "profit", "target": "report"}]};const $=id=>document.getElementById(id);function search(){let t=new Set($('q').value.toLowerCase().match(/\w+/g)||[]);let a=catalog.map(x=>({...x,score:x.tags.split(' ').filter(v=>t.has(v)).length})).filter(x=>x.score).sort((a,b)=>b.score-a.score||b.views-a.views);$('out').textContent=a.map(x=>x.name+' | score '+x.score+' | views '+x.views).join('\n')||'No matches';$('out').style.whiteSpace='pre-wrap';} $('go').onclick=search;$('wf').onchange=()=>{$('q').value=$('wf').selectedIndex?'product margin':'retail sales';search()};graph.nodes.forEach(n=>$('node').add(new Option(n.label,n.id)));function detail(){let id=$('node').value,n=graph.nodes.find(x=>x.id===id);$('detail').textContent=n.type+': '+n.label+'\n'+graph.edges.filter(e=>e.source===id||e.target===id).map(e=>e.source+' → '+e.target).join('\n');}$('node').onchange=detail;$('doc').onclick=()=>{$('report').textContent='# Fictional workbook\n'+graph.nodes.map(n=>'- '+n.type+': '+n.label).join('\n')+'\nDependencies\n'+graph.edges.map(e=>e.source+' → '+e.target).join('\n')};search();detail();</script></html>
